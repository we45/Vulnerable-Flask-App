name: GuardLine Security Scan
on:
  pull_request:
    branches: [main, master]

permissions:
  security-events: write
  issues: write
  pull-requests: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: toutlawbradley/GuardLine@v1.2.0
